services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      # 👇 CHANGE THIS LINE: Remove "/data" from the end
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - registration-network

  kafka:
      image: apache/kafka:4.2.1
      hostname: kafka
      container_name: kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
        KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_PROCESS_ROLES: 'broker,controller'
        KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
        
        KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
        KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
        KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
        CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      healthcheck:
        test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
        interval: 10s
        timeout: 10s
        retries: 10
        start_period: 20s  
      networks:
        - registration-network  
  kafka-init:
    image: apache/kafka:4.2.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command: |
      echo "🚀 Starting Kafka topic initialization..."
      sleep 10
      echo "📋 Creating topics..."
      
      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --create \
        --if-not-exists \
        --topic event.registrations \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --config compression.type=snappy
      
      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --create \
        --if-not-exists \
        --topic event.registration.results \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --config compression.type=snappy
      
      echo "✅ Topic creation completed!"
      echo "📊 Listing all topics:"
      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --list
      
      echo "📈 Topic details:"
      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:29092 \
        --describe \
        --topic event.registrations
    networks:
      - registration-network
    restart: on-failure
  registration-service:
    build:
      context: ./registration-service
      dockerfile: Dockerfile
    container_name: registration_service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEBUG: "false"
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
        - registration-network    
        
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: registration_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: registration-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - registration-network  
networks:
  registration-network:
    driver: bridge
volumes:
  postgres_data:
