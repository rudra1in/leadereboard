[project]
name = "registration-service"
version = "0.1.0"
description = "FastAPI microservice for event registration with Kafka & SSE"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "pydantic-settings>=2.5.2",
    "pydantic[email]>=2.9.0",
    "aiokafka>=0.11.0",
    "sse-starlette>=2.1.3",
    "greenlet>=3.1.0",
]

# 👇 ADD THIS LINE TO SKIP THE PACKAGE WHEEL BUILD
[tool.uv]
package = false
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["app"]
