# pyproject.toml (common package)
[project]
name = "gamex-kafka-template"
version = "1.0.0"
dependencies = [
    "confluent-kafka>=2.15.0,<2.16.0",
    "pydantic-settings>=2.0",
    "tenacity>=9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kafka_template"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"